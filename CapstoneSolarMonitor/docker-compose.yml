version: '3.8'

services:
  # The Traffic Router
  nginx:
    image: nginx:latest
    ports:
      - "5005:80" 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-blue
      - api-green

  # The Blue Environment (Currently Live)
  api-blue:
    build: .
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=SolarMonitorDb;User Id=sa;Password=SolarMonitor_StrongPass123!;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379,abortConnect=false,resolveDns=true
    depends_on:
      - db
      - redis

  # The Green Environment (Currently Idle/Staging)
  api-green:
    build: .
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=SolarMonitorDb;User Id=sa;Password=SolarMonitor_StrongPass123!;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379,abortConnect=false,resolveDns=true
    depends_on:
      - db
      - redis

  # 2. The SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433" # Standard SQL Server port
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SolarMonitor_StrongPass123!

  # 3. Prometheus (Metrics Database)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # 4. Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC receiver for traces

  # 5. Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000" # Grafana Web UI
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  # 6. Redis (In-Memory Cache)
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"